<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | M.R GAME ZONE</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">MR</span><span>M.R <b>GAME ZONE</b><small>LEVEL UP YOUR GAME</small></span></a><nav><a href="index.html">হোম</a><a href="products.html">প্রোডাক্ট</a><a href="cart.html">কার্ট</a></nav></header><main class="section narrow"><span class="eyebrow">CHECKOUT</span><h2>অর্ডার সম্পন্ন করুন</h2><div id="checkout-summary" class="panel"></div><form id="checkout-form" class="panel form-grid"><label>আপনার নাম<input name="name" required></label><label>মোবাইল নম্বর<input name="phone" type="tel" required pattern="[0-9+ -]{8,16}"></label><label class="full">সম্পূর্ণ ঠিকানা<textarea name="address" required rows="3"></textarea></label><label>পেমেন্ট পদ্ধতি<select name="payment" required><option value="Cash on Delivery">Cash on Delivery</option><option value="bKash">bKash</option><option value="Nagad">Nagad</option></select></label><label>Transaction ID (বিকাশ/নগদ হলে)<input name="transaction" placeholder="প্রযোজ্য হলে লিখুন"></label><button class="btn primary full" type="submit">অর্ডার কনফার্ম করুন</button></form><p class="notice">নোট: এই ZIP-এর ডেমো সংস্করণে অর্ডার আপনার এই ব্রাউজারের Local Storage-এ থাকে। লাইভ ব্যবসার জন্য নিরাপদ Backend ও পেমেন্ট গেটওয়ে সেটআপ করতে হবে।</p></main><footer>© M.R GAME ZONE</footer><script src="products.js"></script><script src="script.js"></script></body></html>
